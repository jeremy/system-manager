# SCRATCH: runs testFlake's checks on hosted runners for a fork branch. Never upstream.
name: scratch-checks

on:
  push:
    branches: ["scratch/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shards:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: read
        run: echo "matrix=$(jq -c . .github/scratch-shards.json)" >> "$GITHUB_OUTPUT"

  checks:
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shards.outputs.matrix) }}
    name: ${{ matrix.shard.name }}
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes auto-allocate-uids cgroups
            auto-allocate-uids = true
            use-cgroups = true
            system-features = nixos-test benchmark big-parallel kvm uid-range
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
            max-jobs = auto
            cores = 0
      - name: Nix info
        run: |
          nix --version
          nix config show | grep -E 'sandbox|filter-syscalls|system-features|auto-allocate|cgroups' || true
      - name: Select checks
        env:
          PATTERN: ${{ matrix.shard.pattern }}
        run: |
          nix eval --json ./testFlake#checks.x86_64-linux --apply builtins.attrNames \
            | jq -r '.[]' | grep -E "$PATTERN" > checks.txt
          cat checks.txt
      - name: Build
        run: |
          mapfile -t checks < checks.txt
          args=()
          for c in "${checks[@]}"; do args+=("./testFlake#checks.x86_64-linux.$c"); done
          nix build --no-link --keep-going -L "${args[@]}" > build.log 2>&1 || true
          tail -50 build.log
      - name: Results
        if: always()
        run: |
          mkdir -p logs
          cp build.log logs/ || true
          echo "| check | result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          fail=0
          while read -r c; do
            out=$(nix eval --raw "./testFlake#checks.x86_64-linux.$c.outPath")
            if nix path-info "$out" >/dev/null 2>&1; then
              r=pass
            else
              r=FAIL
              fail=1
              drv=$(nix eval --raw "./testFlake#checks.x86_64-linux.$c.drvPath")
              nix log "$drv" > "logs/$c.log" 2>&1 || true
            fi
            echo "$r $c" | tee -a results.txt
            echo "| $c | $r |" >> "$GITHUB_STEP_SUMMARY"
          done < checks.txt
          cp results.txt logs/
          exit $fail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.shard.name }}
          path: logs/
